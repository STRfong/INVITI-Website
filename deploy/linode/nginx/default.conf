# 映像內的 /etc/nginx/conf.d/default.conf（取代 nginx 預設站台）
# 前面是主機共用的 Caddy（+ Cloudflare），HTTPS 與 www 轉址都在 Caddy 處理，這裡只管靜態檔

# /assets/ 的檔名帶雜湊值，可以長期快取；index.html 與其他路徑每次都要回來驗證，
# 才不會換版後訪客拿到舊的 index.html、指向已經不存在的 assets
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # 轉址時不要帶上容器內部的 port 8080
    absolute_redirect off;

    # 只有 Docker 網路內的 Caddy 連得到；Caddy 已依 trusted_proxies 從 CF-Connecting-IP
    # 取出訪客 IP 放進 X-Real-IP，access log 才會記到真實 IP
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    # text/html 預設就會壓縮；圖片（webp、gif）本身已壓縮，不重複處理
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 找不到的 asset 回 404，不要回 index.html（否則瀏覽器會把 HTML 當 JS 載入）
    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # 前端自己處理路由（/blog、/help-center、/features/...），沒有對應檔案的路徑一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
